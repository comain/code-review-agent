[program:cr_agent_mock_callback]
directory=/opt/app/cr_agent
command=/bin/bash -lc './scripts/run_mock_callback.sh'
autostart=false
autorestart=true
startsecs=2
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/opt/app/cr_agent/logs/mock_callback.stdout.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stderr_logfile=/opt/app/cr_agent/logs/mock_callback.stderr.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=10
environment=HOME="/root",USER="root",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin",MOCK_CALLBACK_HOST="0.0.0.0",MOCK_CALLBACK_PORT="9999",MOCK_CALLBACK_OUTPUT="/opt/app/cr_agent/runtime/mock_callback_requests.jsonl"

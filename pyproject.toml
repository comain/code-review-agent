[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cr-agent"
version = "0.1.0"
description = "LLM scan task carrier service for CI pre-release stage"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "httpx>=0.27,<1.0",
  "jinja2>=3.1,<4.0",
  "langgraph>=0.2,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cr_agent = [
  "templates/*.j2",
  "review_v2/templates/*.j2",
  "review_v2/templates/references/*.md",
  "review_v2/templates/references/personas/*.md",
  "review_v2/templates/references/rules/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
